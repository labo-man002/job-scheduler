server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: job-scheduler-backend
    static_configs:
      - targets: ["localhost"]
        labels:
          job: job-scheduler-backend
          # backend/logs is bind-mounted read-only into this container at this path
          __path__: /var/log/job-scheduler/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
