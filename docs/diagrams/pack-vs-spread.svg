<svg xmlns="http://www.w3.org/2000/svg" width="860" height="376" viewBox="0 0 860 376" role="img" aria-labelledby="title desc">
  <title id="title">Pack and Spread on an eight-node ring</title>
  <desc id="desc">Both policies start with node 0 occupied. Pack chooses the nearest free node, node 1, one hop away. Spread chooses the farthest free node, node 4, four hops away.</desc>
  <rect x="9" y="8" width="411" height="360" rx="15" fill="#f8fafc" stroke="#d5dde7"/>
  <rect x="440" y="8" width="411" height="360" rx="15" fill="#f8fafc" stroke="#d5dde7"/>
  <g fill="#0f172a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="214" y="40" font-size="19" font-weight="700">Pack</text>
    <text x="645" y="40" font-size="19" font-weight="700">Spread</text>
  </g>
  <g fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="214" y="61">Prefer nearby available resources</text>
    <text x="645" y="61">Prefer distant available resources</text>
  </g>
  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round">
    <path d="M214 100 L280 128 L308 194 L280 260 L214 288 L148 260 L120 194 L148 128 Z"/>
    <path d="M645 100 L711 128 L739 194 L711 260 L645 288 L579 260 L551 194 L579 128 Z"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <!-- Pack: node 0 is occupied; node 1 wins the nearest-node tie against node 7. -->
    <g stroke-width="2">
      <circle cx="214" cy="100" r="21" fill="#334155" stroke="#334155"/>
      <circle cx="280" cy="128" r="21" fill="#0d9488" stroke="#0d9488"/>
      <circle cx="308" cy="194" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="280" cy="260" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="214" cy="288" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="148" cy="260" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="120" cy="194" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="148" cy="128" r="21" fill="#ffffff" stroke="#94a3b8"/>
    </g>
    <g fill="#ffffff">
      <text x="214" y="100">0</text>
      <text x="280" y="128">1</text>
    </g>
    <g fill="#334155">
      <text x="308" y="194">2</text><text x="280" y="260">3</text>
      <text x="214" y="288">4</text><text x="148" y="260">5</text>
      <text x="120" y="194">6</text><text x="148" y="128">7</text>
    </g>
    <!-- Spread: same topology and occupancy; node 4 is four hops away. -->
    <g stroke-width="2">
      <circle cx="645" cy="100" r="21" fill="#334155" stroke="#334155"/>
      <circle cx="711" cy="128" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="739" cy="194" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="711" cy="260" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="645" cy="288" r="21" fill="#4f6fc6" stroke="#4f6fc6"/>
      <circle cx="579" cy="260" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="551" cy="194" r="21" fill="#ffffff" stroke="#94a3b8"/>
      <circle cx="579" cy="128" r="21" fill="#ffffff" stroke="#94a3b8"/>
    </g>
    <g fill="#ffffff"><text x="645" y="100">0</text><text x="645" y="288">4</text></g>
    <g fill="#334155">
      <text x="711" y="128">1</text><text x="739" y="194">2</text>
      <text x="711" y="260">3</text><text x="579" y="260">5</text>
      <text x="551" y="194">6</text><text x="579" y="128">7</text>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <circle cx="102" cy="342" r="7" fill="#334155"/>
    <text x="168" y="347" fill="#475569">0 occupied</text>
    <circle cx="268" cy="342" r="7" fill="#0d9488"/>
    <text x="337" y="347" fill="#475569">1 hop</text>
    <circle cx="528" cy="342" r="7" fill="#334155"/>
    <text x="594" y="347" fill="#475569">0 occupied</text>
    <circle cx="696" cy="342" r="7" fill="#4f6fc6"/>
    <text x="763" y="347" fill="#475569">4 hops</text>
  </g>
</svg>
