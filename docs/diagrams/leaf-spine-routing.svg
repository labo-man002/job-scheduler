<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Leaf-spine path selection and failover</title>
  <desc id="desc">Two leaf switches, two spine switches, and two GPU servers. Initially the route from leaf-A to gpu-B uses links L1, L2 and L6 for five microseconds. When L1 goes down, the route switches to L3, L4 and L6 for seven microseconds.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="8" y="8" width="444" height="404" rx="15" fill="#f8fafc" stroke="#d5dde7"/>
    <rect x="468" y="8" width="444" height="404" rx="15" fill="#f8fafc" stroke="#d5dde7"/>
    <g text-anchor="middle">
      <text x="230" y="38" fill="#0f172a" font-size="19" font-weight="700">Healthy fabric</text>
      <text x="690" y="38" fill="#0f172a" font-size="19" font-weight="700">L1 unavailable</text>
      <text x="230" y="60" fill="#475569" font-size="13">Shortest usable path to gpu-B</text>
      <text x="690" y="60" fill="#475569" font-size="13">Reroute via the second spine</text>
    </g>
    <!-- Left panel: physical links; chosen path L1, L2, L6. -->
    <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <path d="M145 124 L145 235"/>
      <path d="M145 124 L315 235"/>
      <path d="M315 124 L145 235"/>
      <path d="M315 124 L315 235"/>
      <path d="M145 235 L145 333"/>
      <path d="M315 235 L315 333"/>
    </g>
    <g fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round">
      <path d="M145 124 L145 235"/>
      <path d="M145 124 L315 235"/>
      <path d="M315 235 L315 333"/>
    </g>
    <!-- Right panel: L1 is physically connected but DOWN; chosen path L3, L4, L6. -->
    <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <path d="M605 124 L605 235"/>
      <path d="M605 124 L775 235"/>
      <path d="M775 124 L605 235"/>
      <path d="M775 124 L775 235"/>
      <path d="M605 235 L605 333"/>
      <path d="M775 235 L775 333"/>
    </g>
    <g fill="none" stroke="#4f6fc6" stroke-width="5" stroke-linecap="round">
      <path d="M775 124 L605 235"/>
      <path d="M775 124 L775 235"/>
      <path d="M775 235 L775 333"/>
    </g>
    <path d="M605 124 L605 235" fill="none" stroke="#dc6262" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round"/>
    <!-- Labels for highlighted path segments; unhighlighted wiring remains visible. -->
    <g font-size="11" font-weight="700" text-anchor="middle">
      <g fill="#f8fafc">
        <rect x="95" y="165" width="34" height="20" rx="5"/>
        <rect x="245" y="166" width="34" height="20" rx="5"/>
        <rect x="324" y="275" width="34" height="20" rx="5"/>
        <rect x="560" y="165" width="34" height="20" rx="5"/>
        <rect x="665" y="174" width="34" height="20" rx="5"/>
        <rect x="786" y="165" width="34" height="20" rx="5"/>
        <rect x="786" y="275" width="34" height="20" rx="5"/>
      </g>
      <g fill="#0f766e">
        <text x="112" y="179">L1</text><text x="262" y="180">L2</text><text x="341" y="289">L6</text>
      </g>
      <text x="577" y="179" fill="#be3d3d">L1</text>
      <g fill="#3657a7">
        <text x="682" y="188">L3</text><text x="803" y="179">L4</text><text x="803" y="289">L6</text>
      </g>
    </g>
    <!-- Device labels: spine, leaf, GPU server. -->
    <g font-size="13" font-weight="700" text-anchor="middle">
      <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
        <rect x="94" y="102" width="102" height="44" rx="8"/>
        <rect x="264" y="102" width="102" height="44" rx="8"/>
        <rect x="94" y="213" width="102" height="44" rx="8"/>
        <rect x="264" y="213" width="102" height="44" rx="8"/>
        <rect x="94" y="311" width="102" height="44" rx="8"/>
        <rect x="264" y="311" width="102" height="44" rx="8"/>
        <rect x="554" y="102" width="102" height="44" rx="8"/>
        <rect x="724" y="102" width="102" height="44" rx="8"/>
        <rect x="554" y="213" width="102" height="44" rx="8"/>
        <rect x="724" y="213" width="102" height="44" rx="8"/>
        <rect x="554" y="311" width="102" height="44" rx="8"/>
        <rect x="724" y="311" width="102" height="44" rx="8"/>
      </g>
      <g fill="#334155">
        <text x="145" y="129">spine-1</text><text x="315" y="129">spine-2</text>
        <text x="145" y="240">leaf-A</text><text x="315" y="240">leaf-B</text>
        <text x="145" y="338">gpu-A</text><text x="315" y="338">gpu-B</text>
        <text x="605" y="129">spine-1</text><text x="775" y="129">spine-2</text>
        <text x="605" y="240">leaf-A</text><text x="775" y="240">leaf-B</text>
        <text x="605" y="338">gpu-A</text><text x="775" y="338">gpu-B</text>
      </g>
    </g>
    <!-- Path summaries taken from test_fixture_paths_constraints_and_rerouting. -->
    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="103" y="372" width="254" height="28" rx="14" fill="#ccfbf1"/>
      <text x="230" y="391" fill="#0f766e">L1 → L2 → L6 · 5 μs</text>
      <rect x="563" y="372" width="254" height="28" rx="14" fill="#dbeafe"/>
      <text x="690" y="391" fill="#3657a7">L3 → L4 → L6 · 7 μs</text>
    </g>
  </g>
</svg>
