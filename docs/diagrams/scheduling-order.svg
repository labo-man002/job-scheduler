<svg xmlns="http://www.w3.org/2000/svg" width="920" height="325" viewBox="0 0 920 325" role="img" aria-labelledby="title desc">
  <title id="title">FIFO and fixed-priority scheduling order</title>
  <desc id="desc">Jobs arrive in the order J1 low, J2 urgent, J3 normal, J4 high. FIFO preserves that order. Fixed-priority scheduling yields J2 urgent, J4 high, J3 normal, J1 low.</desc>
  <rect x="8" y="8" width="904" height="309" rx="15" fill="#f8fafc" stroke="#d5dde7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="460" y="38" fill="#0f172a" font-size="19" font-weight="700" text-anchor="middle">Same jobs, different queue policies</text>
    <g fill="#475569" font-size="14" font-weight="700" text-anchor="end">
      <text x="181" y="99">Submitted</text>
      <text x="181" y="175">FIFO</text>
      <text x="181" y="251">Priority</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1.5">
      <path d="M196 65 V274"/>
      <path d="M205 139 H878"/>
      <path d="M205 215 H878"/>
    </g>
    <!-- Submitted: J1 low, J2 urgent, J3 normal, J4 high. -->
    <g text-anchor="middle" font-size="13" font-weight="700">
      <g transform="translate(218 66)">
        <rect width="142" height="51" rx="9" fill="#e2e8f0" stroke="#a9b6c8"/>
        <text x="71" y="21" fill="#334155">J1</text><text x="71" y="39" fill="#475569" font-size="11">LOW</text>
      </g>
      <g transform="translate(387 66)">
        <rect width="142" height="51" rx="9" fill="#fee2e2" stroke="#e69a9a"/>
        <text x="71" y="21" fill="#991b1b">J2</text><text x="71" y="39" fill="#991b1b" font-size="11">URGENT</text>
      </g>
      <g transform="translate(556 66)">
        <rect width="142" height="51" rx="9" fill="#dbeafe" stroke="#93b4e7"/>
        <text x="71" y="21" fill="#1d4ed8">J3</text><text x="71" y="39" fill="#1d4ed8" font-size="11">NORMAL</text>
      </g>
      <g transform="translate(725 66)">
        <rect width="142" height="51" rx="9" fill="#fef3c7" stroke="#e5c86d"/>
        <text x="71" y="21" fill="#92400e">J4</text><text x="71" y="39" fill="#92400e" font-size="11">HIGH</text>
      </g>
      <!-- FIFO keeps submission order. -->
      <g transform="translate(218 142)">
        <rect width="142" height="51" rx="9" fill="#e2e8f0" stroke="#a9b6c8"/>
        <text x="71" y="21" fill="#334155">J1</text><text x="71" y="39" fill="#475569" font-size="11">LOW</text>
      </g>
      <g transform="translate(387 142)">
        <rect width="142" height="51" rx="9" fill="#fee2e2" stroke="#e69a9a"/>
        <text x="71" y="21" fill="#991b1b">J2</text><text x="71" y="39" fill="#991b1b" font-size="11">URGENT</text>
      </g>
      <g transform="translate(556 142)">
        <rect width="142" height="51" rx="9" fill="#dbeafe" stroke="#93b4e7"/>
        <text x="71" y="21" fill="#1d4ed8">J3</text><text x="71" y="39" fill="#1d4ed8" font-size="11">NORMAL</text>
      </g>
      <g transform="translate(725 142)">
        <rect width="142" height="51" rx="9" fill="#fef3c7" stroke="#e5c86d"/>
        <text x="71" y="21" fill="#92400e">J4</text><text x="71" y="39" fill="#92400e" font-size="11">HIGH</text>
      </g>
      <!-- Priority policy: urgent, high, normal, low. -->
      <g transform="translate(218 218)">
        <rect width="142" height="51" rx="9" fill="#fee2e2" stroke="#e69a9a"/>
        <text x="71" y="21" fill="#991b1b">J2</text><text x="71" y="39" fill="#991b1b" font-size="11">URGENT</text>
      </g>
      <g transform="translate(387 218)">
        <rect width="142" height="51" rx="9" fill="#fef3c7" stroke="#e5c86d"/>
        <text x="71" y="21" fill="#92400e">J4</text><text x="71" y="39" fill="#92400e" font-size="11">HIGH</text>
      </g>
      <g transform="translate(556 218)">
        <rect width="142" height="51" rx="9" fill="#dbeafe" stroke="#93b4e7"/>
        <text x="71" y="21" fill="#1d4ed8">J3</text><text x="71" y="39" fill="#1d4ed8" font-size="11">NORMAL</text>
      </g>
      <g transform="translate(725 218)">
        <rect width="142" height="51" rx="9" fill="#e2e8f0" stroke="#a9b6c8"/>
        <text x="71" y="21" fill="#334155">J1</text><text x="71" y="39" fill="#475569" font-size="11">LOW</text>
      </g>
    </g>
    <text x="460" y="296" fill="#64748b" font-size="12" text-anchor="middle">Queue order is policy-dependent; resource feasibility is evaluated later by the placer.</text>
  </g>
</svg>
